# COMPASS, tokenized trunk (shared per-token read-out).
name: compass_tokenized
backend: jax
device: gpu
compass:
  arch: tokenized
  time_embedding_size: 128
  token_offset: true
  hidden_size: 64
  depth: 6
  num_heads: 4
  mlp_ratio: 3
  sde: vesde
  sigma: 25.0
  z_score: true
  mask_law: simformer        # their five-way structured-random law
  time_sampling: log_sigma
  lr: 1.0e-3
  batch_size: 1000
  validation_fraction: 0.1
  patience_steps: 5000
  sampler: dpm
  order: 2
  churn_eta: 2.0
  timesteps: 50
  eps: 1.0e-3
