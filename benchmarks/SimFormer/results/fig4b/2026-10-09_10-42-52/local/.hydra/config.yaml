name: fig4b
seed: 0
model_id: null
save_model: false
save_summary: true
method:
  name: compass_upstream_v11
  backend: jax
  device: gpu
  compass:
    compass_src: compass_upstream_v11/src
    hidden_size: 128
    depth: 6
    num_heads: 16
    mlp_ratio: 4
    sde: vesde
    sigma: 25.0
    z_score: true
    time_sampling: mixture
    lr: 0.001
    batch_size: 1000
    validation_fraction: 0.1
    patience_steps: 1000000000
    sampler: dpm
    order: 2
    timesteps: 50
    eps: 0.001
task:
  name: two_moons_all_cond
  num_simulations: 100000
eval:
  metric:
    c2st:
      n_folds: 5
      metric: accuracy
      classifier: rf
      condition_mask_fn: structured_random
      num_samples: 2000
      num_evaluations: 50
partition: {}
sweeper:
  name: null
  objective: null
