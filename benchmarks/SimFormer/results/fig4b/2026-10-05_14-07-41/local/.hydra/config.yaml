name: fig4b
seed: 0
model_id: null
save_model: false
save_summary: true
method:
  name: compass_fx_inscale_fullattn
  backend: jax
  device: gpu
  compass:
    arch: legacy
    hidden_size: 64
    depth: 6
    num_heads: 4
    mlp_ratio: 3
    sde: vesde
    sigma: 25.0
    z_score: true
    mask_law: simformer
    time_sampling: log_sigma
    lr: 0.001
    batch_size: 1000
    validation_fraction: 0.1
    patience_steps: 1000000000
    sampler: dpm
    order: 2
    churn_eta: 2.0
    timesteps: 100
    eps: 1.0e-05
    forward_eps: true
    arch_variant: full_attn
    full_attn_base: legacy
    input_scaling: true
task:
  name: two_moons_all_cond
  num_simulations: 1000
eval:
  metric:
    c2st:
      n_folds: 5
      metric: accuracy
      classifier: rf
      condition_mask_fn: structured_random
      num_samples: 2000
      num_evaluations: 50
partition: {}
sweeper:
  name: null
  objective: null
